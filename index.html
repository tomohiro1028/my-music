<!doctype html><html lang="ja"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#111"><link rel="manifest" href="manifest.webmanifest">
<title>My Music</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#111;color:#fff;font-family:-apple-system,BlinkMacSystemFont,sans-serif}
header{position:sticky;top:0;background:#111e;backdrop-filter:blur(15px);padding:16px;z-index:2}h1{margin:0}.sub{color:#999;font-size:12px}
button,label{border:0;border-radius:11px;padding:10px;background:#292929;color:#fff;font-size:14px}
.add{display:block;text-align:center;background:#fff;color:#111;font-weight:bold;margin-top:10px}input[type=file]{display:none}
main{padding:8px 12px 245px}.empty{text-align:center;color:#888;padding:70px 15px}
.row{display:flex;align-items:center;gap:10px;padding:12px 3px;border-bottom:1px solid #292929}.info{flex:1;min-width:0}
.name{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.meta{font-size:11px;color:#777}.row button{background:none;font-size:19px;padding:6px}
.player{position:fixed;left:0;right:0;bottom:0;background:#1b1b1bee;backdrop-filter:blur(18px);padding:12px 16px calc(12px + env(safe-area-inset-bottom));z-index:3;border-top:1px solid #333}
.current{font-weight:bold;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.times{display:flex;justify-content:space-between;color:#999;font-size:11px}
input[type=range]{width:100%;accent-color:#fff}.controls{text-align:center}.controls button{background:none;font-size:22px;margin:0 8px}.controls .big{font-size:38px}
.options{text-align:center;margin-top:5px}.active{outline:1px solid #fff}dialog{background:#222;color:#fff;border:1px solid #555;border-radius:15px}
</style></head><body>
<header><h1>My Music</h1><div class="sub">自分用ミュージックプレーヤー</div>
<label class="add">＋ 曲を追加<input id="files" type="file" accept="audio/*" multiple></label>
<div style="display:flex;gap:8px;margin-top:8px"><button id="shuffle">🔀 シャッフル</button><button id="repeat">🔁 リピートOFF</button><button id="sleep">⏱ スリープ</button></div></header>
<main id="list"></main>
<section class="player"><div id="current" class="current">曲を選択してください</div>
<input id="seek" type="range" min="0" max="1000" value="0"><div class="times"><span id="elapsed">0:00</span><span id="duration">0:00</span></div>
<div class="controls"><button id="prev">⏮</button><button id="play" class="big">▶︎</button><button id="next">⏭</button></div></section>
<audio id="audio" preload="metadata"></audio>
<script>
const A=document.getElementById("audio"),L=document.getElementById("list"),F=document.getElementById("files"),S=document.getElementById("seek");
const C=document.getElementById("current"),P=document.getElementById("play"),E=document.getElementById("elapsed"),D=document.getElementById("duration");
let db,tracks=[],i=-1,shuffle=false,repeat=false,timer=null;
const req=indexedDB.open("MyMusicDB",1);req.onupgradeneeded=e=>e.target.result.createObjectStore("tracks",{keyPath:"id"});
req.onsuccess=e=>{db=e.target.result;loadDB()};
function store(mode="readonly"){return db.transaction("tracks",mode).objectStore("tracks")}
function all(){return new Promise(r=>{let q=store().getAll();q.onsuccess=()=>r(q.result.sort((a,b)=>a.added-b.added))})}
async function loadDB(){tracks=await all();render()}
function put(x){return new Promise(r=>{let q=store("readwrite").put(x);q.onsuccess=r})}
function del(id){return new Promise(r=>{let q=store("readwrite").delete(id);q.onsuccess=r})}
function fmt(x){if(!isFinite(x))return"0:00";x=Math.floor(x);return Math.floor(x/60)+":"+String(x%60).padStart(2,"0")}
function render(){L.innerHTML=tracks.length?tracks.map((t,n)=>`<div class="row"><div class="info"><div class="name">${esc(t.name)}</div><div class="meta">${n===i?"再生中":""}</div></div><button onclick="load(${n})">▶︎</button><button onclick="removeTrack(${n})">🗑</button></div>`).join(""):'<div class="empty">まだ曲がありません<br>「＋ 曲を追加」から音楽ファイルを選んでください。<br><br>曲はこの端末のブラウザ内に保存されます。</div>'}
function esc(s){return s.replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}
async function load(n,auto=true){if(!tracks[n])return;i=n;A.src=URL.createObjectURL(tracks[n].blob);C.textContent=tracks[n].name;if(auto)try{await A.play()}catch(e){}render();media()}
function nxt(){if(!tracks.length)return -1;if(repeat)return i;if(shuffle)return Math.floor(Math.random()*tracks.length);return(i+1)%tracks.length}
function prv(){return tracks.length?(i-1+tracks.length)%tracks.length:-1}
async function removeTrack(n){if(confirm("この曲を削除しますか？")){await del(tracks[n].id);if(n===i){A.pause();i=-1;A.removeAttribute("src");C.textContent="曲を選択してください"}tracks=await all();render()}}
F.onchange=async e=>{for(const f of e.target.files)await put({id:crypto.randomUUID(),name:f.name,blob:f,added:Date.now()+Math.random()});tracks=await all();render();if(i<0&&tracks.length)load(0,false);F.value=""};
P.onclick=()=>A.src?(A.paused?A.play():A.pause()):tracks.length&&load(0);
document.getElementById("next").onclick=()=>load(nxt());document.getElementById("prev").onclick=()=>load(prv());
A.onplay=()=>P.textContent="❚❚";A.onpause=()=>P.textContent="▶︎";A.ontimeupdate=()=>{if(A.duration){S.value=A.currentTime/A.duration*1000;E.textContent=fmt(A.currentTime);D.textContent=fmt(A.duration)}};
A.onloadedmetadata=()=>{D.textContent=fmt(A.duration)};A.onended=()=>load(nxt());
S.oninput=()=>{if(A.duration)A.currentTime=A.duration*S.value/1000};
document.getElementById("shuffle").onclick=e=>{shuffle=!shuffle;e.currentTarget.classList.toggle("active",shuffle)};
document.getElementById("repeat").onclick=e=>{repeat=!repeat;e.currentTarget.textContent=repeat?"🔁 リピートON":"🔁 リピートOFF"};
document.getElementById("sleep").onclick=()=>{let m=prompt("何分後に停止？（15 / 30 / 60 / 120）");if(m){clearTimeout(timer);timer=setTimeout(()=>A.pause(),Number(m)*60000)}};
function media(){if(!("mediaSession"in navigator)||!tracks[i])return;navigator.mediaSession.metadata=new MediaMetadata({title:tracks[i].name,artist:"My Music"});
navigator.mediaSession.setActionHandler("play",()=>A.play());navigator.mediaSession.setActionHandler("pause",()=>A.pause());navigator.mediaSession.setActionHandler("nexttrack",()=>load(nxt()));navigator.mediaSession.setActionHandler("previoustrack",()=>load(prv()))}
</script></body></html>
