<!doctype html>
<html lang="ja"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111"><link rel="manifest" href="manifest.webmanifest"><title>My Music</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#111;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
header{position:sticky;top:0;background:#151515;padding:18px 16px 12px;z-index:5}h1{font-size:24px;margin:0 0 12px}nav{display:flex;gap:8px}
button{border:0;border-radius:12px;padding:10px 13px;background:#2a2a2a;color:#fff;font-size:14px}button.active{background:#fff;color:#111}
main{padding:14px 14px 190px}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.song{background:#1b1b1b;border-radius:14px;padding:12px;margin:8px 0;display:flex;align-items:center;gap:10px}
.song .name{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.mini{padding:7px 9px;font-size:13px}
.card{background:#1b1b1b;border-radius:14px;padding:14px;margin:9px 0}.row{display:flex;align-items:center;gap:8px}.grow{flex:1}
.player{position:fixed;left:0;right:0;bottom:0;background:#181818;border-top:1px solid #333;padding:10px 14px calc(10px + env(safe-area-inset-bottom));z-index:10}
#now{font-size:14px;margin-bottom:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
input[type=range]{width:100%}.controls{display:flex;justify-content:center;gap:10px;margin-top:7px}.controls button{font-size:18px;min-width:48px}
.muted{color:#aaa;font-size:13px}.hidden{display:none}.playlist-title{font-size:18px;font-weight:700}.empty{color:#aaa;text-align:center;padding:35px 10px}
</style></head><body>
<header><h1>🎵 My Music</h1><nav><button id="tabSongs" class="active">曲</button><button id="tabPlaylists">プレイリスト</button></nav></header>
<main>
<section id="songsView"><div class="toolbar">
<button id="importBtn">＋ 曲を追加</button><button id="shuffleBtn">🔀 シャッフル</button>
<button id="repeatBtn">↻ リピート: OFF</button><button id="timerBtn">⏱ スリープ</button></div>
<input id="fileInput" type="file" accept="audio/*" multiple class="hidden"><div id="songList"></div></section>
<section id="playlistsView" class="hidden"><div class="toolbar"><button id="newPlaylistBtn">＋ プレイリスト作成</button></div>
<div id="playlistList"></div><div id="playlistDetail" class="hidden"></div></section></main>
<div class="player"><div id="now">曲を選択してください</div><input id="seek" type="range" min="0" max="1000" value="0">
<div class="controls"><button id="prev">⏮</button><button id="play">▶️</button><button id="next">⏭</button></div></div>
<audio id="audio" preload="metadata"></audio>
<script>
const DB="MyMusicDB",VER=2;let db,tracks=[],playlists=[],queue=[],currentIndex=-1,currentPlaylistId=null,shuffle=false,repeat=false,sleepTimer=null,objectUrl=null;
const audio=document.getElementById("audio"),$=id=>document.getElementById(id);
function openDB(){return new Promise((res,rej)=>{const r=indexedDB.open(DB,VER);r.onupgradeneeded=e=>{const d=e.target.result;if(!d.objectStoreNames.contains("tracks"))d.createObjectStore("tracks",{keyPath:"id"});if(!d.objectStoreNames.contains("playlists"))d.createObjectStore("playlists",{keyPath:"id"});};r.onsuccess=()=>{db=r.result;res()};r.onerror=()=>rej(r.error)})}
function all(s){return new Promise((res,rej)=>{let r=db.transaction(s).objectStore(s).getAll();r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}
function put(s,v){return new Promise((res,rej)=>{let r=db.transaction(s,"readwrite").objectStore(s).put(v);r.onsuccess=()=>res();r.onerror=()=>rej(r.error)})}
function del(s,id){return new Promise((res,rej)=>{let r=db.transaction(s,"readwrite").objectStore(s).delete(id);r.onsuccess=()=>res();r.onerror=()=>rej(r.error)})}
async function refresh(){tracks=await all("tracks");tracks.sort((a,b)=>a.added-b.added);playlists=await all("playlists");renderSongs();renderPlaylists()}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function renderSongs(){const el=$("songList");el.innerHTML="";if(!tracks.length){el.innerHTML='<div class="empty">まだ曲がありません。<br>「＋ 曲を追加」から音源ファイルを入れてください。</div>';return}
tracks.forEach(t=>{const d=document.createElement("div");d.className="song";d.innerHTML=`<div class="name">${esc(t.name)}</div><button class="mini play">▶</button><button class="mini add">＋</button><button class="mini del">削除</button>`;
d.querySelector(".play").onclick=()=>playTrack(t.id);d.querySelector(".add").onclick=()=>choosePlaylist(t.id);d.querySelector(".del").onclick=()=>deleteTrack(t.id);el.appendChild(d)})}
function renderPlaylists(){const el=$("playlistList");el.innerHTML="";if(!playlists.length){el.innerHTML='<div class="empty">プレイリストはまだありません。</div>';return}
playlists.sort((a,b)=>a.created-b.created).forEach(p=>{const d=document.createElement("div");d.className="card";d.innerHTML=`<div class="row"><div class="grow"><div class="playlist-title">📁 ${esc(p.name)}</div><div class="muted">${p.trackIds.length}曲</div></div><button class="mini open">開く</button><button class="mini rename">名前変更</button><button class="mini del">削除</button></div>`;
d.querySelector(".open").onclick=()=>openPlaylist(p.id);d.querySelector(".rename").onclick=()=>renamePlaylist(p.id);d.querySelector(".del").onclick=()=>deletePlaylist(p.id);el.appendChild(d)})}
async function choosePlaylist(trackId){if(!playlists.length){alert("先にプレイリストを作成してください。");return}const msg=playlists.map((p,i)=>`${i+1}. ${p.name}`).join("\n");const ans=prompt("追加先の番号を入力してください\n\n"+msg),i=Number(ans)-1;if(!Number.isInteger(i)||!playlists[i])return;const p=playlists[i];if(!p.trackIds.includes(trackId))p.trackIds.push(trackId);await put("playlists",p);await refresh();alert("プレイリストに追加しました")}
async function createPlaylist(){const n=prompt("プレイリスト名を入力");if(!n?.trim())return;await put("playlists",{id:crypto.randomUUID(),name:n.trim(),trackIds:[],created:Date.now()});await refresh()}
async function renamePlaylist(id){const p=playlists.find(x=>x.id===id),n=prompt("新しい名前",p?.name);if(p&&n?.trim()){p.name=n.trim();await put("playlists",p);await refresh()}}
async function deletePlaylist(id){if(!confirm("プレイリストを削除しますか？曲本体は削除されません。"))return;await del("playlists",id);if(currentPlaylistId===id)closePlaylist();await refresh()}
function openPlaylist(id){currentPlaylistId=id;const p=playlists.find(x=>x.id===id);$("playlistDetail").classList.remove("hidden");$("playlistDetail").innerHTML=`<div class="card"><div class="row"><button id="backP">← 戻る</button><div class="grow playlist-title">📁 ${esc(p.name)}</div><button id="playP">▶ 再生</button></div><div id="pSongs"></div></div>`;$("backP").onclick=closePlaylist;$("playP").onclick=()=>playPlaylist(id);renderPlaylistDetail(p)}
function closePlaylist(){currentPlaylistId=null;$("playlistDetail").classList.add("hidden")}
function renderPlaylistDetail(p){const el=$("pSongs");el.innerHTML="";const valid=p.trackIds.map(id=>tracks.find(t=>t.id===id)).filter(Boolean);if(!valid.length){el.innerHTML='<div class="empty">曲を追加してください。</div>';return}
valid.forEach(t=>{const d=document.createElement("div");d.className="song";d.innerHTML=`<div class="name">${esc(t.name)}</div><button class="mini play">▶</button><button class="mini remove">外す</button>`;d.querySelector(".play").onclick=()=>playTrack(t.id,p.id);d.querySelector(".remove").onclick=async()=>{p.trackIds=p.trackIds.filter(x=>x!==t.id);await put("playlists",p);await refresh();renderPlaylistDetail(p)};el.appendChild(d)})}
function playPlaylist(id){const p=playlists.find(x=>x.id===id);currentPlaylistId=id;queue=p.trackIds.filter(id=>tracks.some(t=>t.id===id));currentIndex=0;loadCurrent(true)}
function playTrack(id,pid=null){currentPlaylistId=pid;queue=pid?(playlists.find(p=>p.id===pid)?.trackIds||[]):tracks.map(t=>t.id);currentIndex=Math.max(0,queue.indexOf(id));loadCurrent(true)}
function loadCurrent(auto){const t=tracks.find(x=>x.id===queue[currentIndex]);if(!t)return;if(objectUrl)URL.revokeObjectURL(objectUrl);objectUrl=URL.createObjectURL(t.blob);audio.src=objectUrl;$("now").textContent=t.name;if(auto)audio.play().catch(()=>{})}
function next(){if(!queue.length)return;if(repeat){loadCurrent(true);return}if(shuffle)currentIndex=Math.floor(Math.random()*queue.length);else{currentIndex++;if(currentIndex>=queue.length){currentIndex=0;if(!currentPlaylistId)return}}loadCurrent(true)}
function prev(){if(audio.currentTime>3){audio.currentTime=0;return}if(!queue.length)return;currentIndex=(currentIndex-1+queue.length)%queue.length;loadCurrent(true)}
async function deleteTrack(id){if(!confirm("この曲を削除しますか？"))return;await del("tracks",id);for(const p of playlists){if(p.trackIds.includes(id)){p.trackIds=p.trackIds.filter(x=>x!==id);await put("playlists",p)}}await refresh()}
$("importBtn").onclick=()=>$("fileInput").click();$("fileInput").onchange=async e=>{for(const f of e.target.files)if(f.type.startsWith("audio/"))await put("tracks",{id:crypto.randomUUID(),name:f.name,blob:f,added:Date.now()});e.target.value="";await refresh()};
$("tabSongs").onclick=()=>{$("songsView").classList.remove("hidden");$("playlistsView").classList.add("hidden");$("tabSongs").classList.add("active");$("tabPlaylists").classList.remove("active")};
$("tabPlaylists").onclick=()=>{$("songsView").classList.add("hidden");$("playlistsView").classList.remove("hidden");$("tabPlaylists").classList.add("active");$("tabSongs").classList.remove("active")};
$("newPlaylistBtn").onclick=createPlaylist;$("play").onclick=()=>audio.paused?(audio.src?audio.play():queue.length&&loadCurrent(true)):audio.pause();$("next").onclick=next;$("prev").onclick=prev;
$("shuffleBtn").onclick=()=>{shuffle=!shuffle;$("shuffleBtn").textContent=shuffle?"🔀 シャッフル: ON":"🔀 シャッフル"};$("repeatBtn").onclick=()=>{repeat=!repeat;$("repeatBtn").textContent=repeat?"↻ リピート: ON":"↻ リピート: OFF"};
$("timerBtn").onclick=()=>{const n=Number(prompt("何分後に停止？（0で解除）","30"));clearTimeout(sleepTimer);if(n>0)sleepTimer=setTimeout(()=>audio.pause(),n*60000)};
audio.ontimeupdate=()=>{$("seek").value=audio.duration?audio.currentTime/audio.duration*1000:0};$("seek").oninput=()=>{if(audio.duration)audio.currentTime=$("seek").value/1000*audio.duration};audio.onplay=()=>{$("play").textContent="⏸"};audio.onpause=()=>{$("play").textContent="▶️"};audio.onended=next;
if("mediaSession"in navigator){navigator.mediaSession.setActionHandler("play",()=>audio.play());navigator.mediaSession.setActionHandler("pause",()=>audio.pause());navigator.mediaSession.setActionHandler("nexttrack",next);navigator.mediaSession.setActionHandler("previoustrack",prev)}
openDB().then(refresh);
</script></body></html>
